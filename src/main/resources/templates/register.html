<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>User Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:url('https://images.unsplash.com/photo-1521587760476-6c12a4b040da')
            no-repeat center center fixed;
            background-size:cover;
        }

        .overlay{
            min-height:100vh;
            background:rgba(0,0,0,0.65);
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:420px;
            border-radius:15px;
        }

    </style>

</head>

<body>

<div class="overlay">

    <div class="card shadow p-4">

        <h3 class="text-center mb-4">
            📝 User Registration
        </h3>

        <!-- SUCCESS -->
        <div th:if="${msg}"
             class="alert alert-success">

            <span th:text="${msg}"></span>

        </div>

        <!-- ERROR -->
        <div th:if="${error}"
             class="alert alert-danger">

            <span th:text="${error}"></span>

        </div>

        <form method="post"
              action="/register">

            <div class="mb-3">

                <label>Full Name</label>

                <input type="text"
                       name="fullName"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>Email</label>

                <input type="email"
                       name="email"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>Mobile</label>

                <input type="text"
                       name="mobile"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>Password</label>

                <input type="password"
                       name="password"
                       class="form-control"
                       required>

            </div>

            <button class="btn btn-success w-100">
                Register
            </button>

        </form>

        <div class="text-center mt-3">

            <a href="/login">
                Already have account? Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
