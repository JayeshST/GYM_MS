<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Book Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


       <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;

        background: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f')
        no-repeat center center fixed;

        background-size: cover;
    }

    /* Dark overlay for readability */
    .overlay {
        min-height: 100vh;
        background: rgba(0,0,0,0.55);
        padding: 30px;
    }

        .card {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .book-title {
            font-size: 28px;
            font-weight: bold;
        }

        .price {
            font-size: 22px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <a href="/books" class="btn btn-secondary mb-3">⬅ Back</a>

    <div class="card p-4">

        <h2 class="book-title">📖 <span th:text="${book.title}"></span></h2>

        <p>Author: <b th:text="${book.author}"></b></p>

        <p class="price">₹ <span th:text="${book.price}"></span></p>

        <hr>

        <form action="/add-to-cart" method="post" th:object="${item}">

            <input type="hidden" th:field="*{bookId}">
            <input type="hidden" th:field="*{title}">
            <input type="hidden" th:field="*{price}">

            <div class="mb-3">
                <label>Delivery Address</label>
                <textarea class="form-control" th:field="*{address}" required></textarea>
            </div>

            <button class="btn btn-success">
                🛒 Add To Cart
            </button>

        </form>

    </div>

</div>

</body>
</html>
